name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write   # npm Trusted Publishing (OIDC)，无需 NPM_TOKEN
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Trusted Publishing 需要 npm CLI >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm publish --access public --provenance
